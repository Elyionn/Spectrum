name: Build Spectrum v1.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Spectrum 1.5 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Spectrum 1.5 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Spectrum_v1.5_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Spectrum ZIP file not found!"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/spectrum-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/spectrum-project"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/spectrum-project" -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f "$GITHUB_WORKSPACE/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Spectrum project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/elyionn/spektrum/MainActivity.kt
          test -f app/src/main/res/drawable-nodpi/spectrum_logo.png

          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "1.5.0"' app/build.gradle.kts

          echo "Spectrum 1.5 source verification passed."

      - name: Build Spectrum APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-v1.5-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
