
name: Spectrum 1.6.7 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Spectrum_1.6.7_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build Spectrum 1.6.7
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          LICENSE_INPUT="$RUNNER_TEMP/android-sdk-licenses.txt"
          for _ in {1..100}; do printf 'y\n'; done > "$LICENSE_INPUT"
          sdkmanager --licenses < "$LICENSE_INPUT"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Safely extract exact 1.6.7 source archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("Spectrum_1.6.7_Android_Project.zip")
          if not archive.is_file():
              raise SystemExit(f"Missing required archive: {archive}")

          out = Path(os.environ["RUNNER_TEMP"]) / "spectrum-167"
          out.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")

              names = zf.namelist()
              settings = [
                  n for n in names
                  if PurePosixPath(n).name == "settings.gradle.kts"
              ]

              matches = []
              for item in settings:
                  prefix = str(PurePosixPath(item).parent)
                  build = (prefix + "/" if prefix != "." else "") + "app/build.gradle.kts"
                  if build in names and 'versionName = "1.6.7"' in zf.read(build).decode("utf-8", "replace"):
                      matches.append(item)

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one 1.6.7 Android project root; found {len(matches)}"
                  )

              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe ZIP entry rejected: {info.filename}")

              zf.extractall(out)

          project = (out / str(PurePosixPath(matches[0]).parent)).resolve()
          if not project.is_relative_to(out.resolve()):
              raise SystemExit("Project root escaped extraction directory")

          if not (project / "app/src/main/AndroidManifest.xml").is_file():
              raise SystemExit("Android manifest missing from extracted project")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dir={project}\n")

          print(f"Validated project root: {project}")
          PY

      - name: Verify version and app identity
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 20' app/build.gradle.kts
          grep -Fq 'versionName = "1.6.7"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          grep -Fq 'namespace = "com.elyionn.spektrum"' app/build.gradle.kts
          test -s app/src/test/java/com/elyionn/spektrum/PeriodicTableDataTest.kt

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate XML, JSON, periodic table and local JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path

          base = Path("app/src/main")
          xmls = list(base.rglob("*.xml"))
          for p in xmls:
              ET.parse(p)

          data = json.loads(
              (base / "assets/data/science_topics.json").read_text(encoding="utf-8")
          )

          slugs = [x.get("slug") for x in data]
          if len(data) < 100 or len(slugs) != len(set(slugs)) or any(
              not x.get(k) for x in data
              for k in ("title", "lead", "how", "life", "facts")
          ):
              raise SystemExit("Science Atlas data is incomplete or has duplicate slugs")

          src = (
              base / "java/com/elyionn/spektrum/PeriodicTableData.kt"
          ).read_text(encoding="utf-8")

          block = src.split("val elementRows = listOf(", 1)[1].split(
              ").map { it.split", 1
          )[0]

          rows = re.findall(r'"([A-Z][a-z]?)\|[^|]+\|(\d+)\|', block)

          if len(rows) != 118 or sorted(int(n) for _, n in rows) != list(range(1, 119)):
              raise SystemExit(
                  f"Expected exactly 118 periodic-table records; got {len(rows)}"
              )

          layout = src.split("val periodicTableRows:", 1)[1].split("\n)", 1)[0]
          if len(re.findall(r"listOf<Int\?>\(", layout)) < 2:
              raise SystemExit("Periodic-table layout declaration missing")

          main = (
              base / "java/com/elyionn/spektrum/MainActivity.kt"
          ).read_text(encoding="utf-8")

          if "rememberInfiniteTransition" in main or "animateFloat(" in main:
              raise SystemExit("Unexpected permanent Compose animation in MainActivity")

          if "let rot=0,drag=false,px=0,auto=false;" not in main:
              raise SystemExit("Embedded atom scene must default to on-demand rendering")

          print(
              f"Validated {len(xmls)} XML files, {len(data)} unique lessons, "
              "118 elements and idle-rendering guards"
          )
          PY

          node --check app/src/main/assets/lab/three.module.js

      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest

      - name: Verify unit tests executed
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT="app/build/test-results/testDebugUnitTest"
          test -d "$REPORT"

          python3 - "$REPORT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          files = list(Path(sys.argv[1]).glob("TEST-*.xml"))
          if not files:
              raise SystemExit("No JUnit XML reports found; test task may have been NO-SOURCE")

          total = failures = errors = 0
          for p in files:
              r = ET.parse(p).getroot()
              total += int(r.attrib.get("tests", 0))
              failures += int(r.attrib.get("failures", 0))
              errors += int(r.attrib.get("errors", 0))

          if total < 7 or failures or errors:
              raise SystemExit(
                  f"JUnit report invalid: tests={total}, failures={failures}, errors={errors}"
              )

          print(f"JUnit passed: {total} tests")
          PY

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APKs and package identity
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -s "$DEBUG_APK" && test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"

          test "$(apkanalyzer manifest application-id "$DEBUG_APK")" = "com.elyionn.spectrum.debug"
          test "$(apkanalyzer manifest application-id "$RELEASE_APK")" = "com.elyionn.spectrum"

          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload APKs, test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.6.7-build-results
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
            ${{ steps.project.outputs.dir }}/app/build/test-results/**
            ${{ steps.project.outputs.dir }}/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
          
