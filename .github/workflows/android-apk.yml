name: Spectrum 1.7.6 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Spectrum_1.7.6_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build Spectrum 1.7.6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept SDK licenses and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          python3 - "$SDKMANAGER" <<'PYLICENSE'
          import subprocess, sys
          proc = subprocess.run([sys.argv[1], "--licenses"], input="y\n" * 100, text=True, check=False)
          if proc.returncode != 0:
              raise SystemExit(proc.returncode)
          PYLICENSE
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Validate and safely extract source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("Spectrum_1.7.6_Android_Project.zip")
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Source ZIP is missing or empty at repository root.")
          out = Path(os.environ["RUNNER_TEMP"]) / "spectrum-176"
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad: raise SystemExit(f"ZIP CRC failed: {bad}")
              names = zf.namelist()
              if len(names) != len(set(names)): raise SystemExit("Duplicate ZIP member paths found.")
              for info in zf.infolist():
                  path = PurePosixPath(info.filename.replace("\\", "/"))
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe ZIP member: {info.filename}")
              settings = [n for n in names if PurePosixPath(n).name == "settings.gradle.kts"]
              roots = []
              for item in settings:
                  parent = str(PurePosixPath(item).parent)
                  prefix = "" if parent == "." else parent + "/"
                  if prefix + "app/build.gradle.kts" in names and prefix + "app/src/main/AndroidManifest.xml" in names: roots.append(parent)
              if len(roots) != 1: raise SystemExit(f"Expected one project root, found: {roots}")
              root = roots[0]
              prefix = "" if root == "." else root + "/"
              build = zf.read(prefix + "app/build.gradle.kts").decode("utf-8")
              if 'versionName = "1.7.6"' not in build or "versionCode = 29" not in build: raise SystemExit("ZIP version metadata mismatch.")
              zf.extractall(out)
          project = (out / root).resolve()
          if not project.is_relative_to(out.resolve()): raise SystemExit("Project root escaped extraction directory.")
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml", "app/src/main/assets/lab/index.html"):
              if not (project / required).is_file(): raise SystemExit(f"Required file missing: {required}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f: f.write(f"dir={project}\n")
          print(f"Validated source project: {project}")
          PY

      - name: Verify version, application identity and 3D fallback
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 29' app/build.gradle.kts
          grep -Fq 'versionName = "1.7.6"' app/build.gradle.kts
          grep -Fq 'compileSdk = 35' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          grep -Fq 'namespace = "com.elyionn.spektrum"' app/build.gradle.kts
          grep -Fq 'onRenderProcessGone' app/src/main/java/com/elyionn/spektrum/MainActivity.kt
          grep -Fq 'LAYER_TYPE_SOFTWARE' app/src/main/java/com/elyionn/spektrum/MainActivity.kt
          grep -Fq "getContext('2d'" app/src/main/assets/lab/index.html
          if grep -Eq 'WebGLRenderer|THREE\.|type="module"' app/src/main/assets/lab/index.html; then echo "Unexpected WebGL dependency remains"; exit 1; fi
          test ! -e app/src/main/assets/lab/three.module.js

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate resources, content and 3D scenes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path("app/src/main")
          for p in base.rglob("*.xml"): ET.parse(p)
          data = json.loads((base / "assets/data/science_topics.json").read_text(encoding="utf-8"))
          required = ("slug", "title", "category", "summary", "lead", "how", "life", "facts")
          slugs = [x.get("slug") for x in data]
          if len(data) != 151 or len(slugs) != len(set(slugs)) or any(not x.get(k) for x in data for k in required):
              raise SystemExit("Science content must contain 151 complete lessons with unique slugs.")
          expected = {"biyoloji":26,"fizik":26,"kimya":23,"matematik":21,"uzay":21,"elektronik":20,"yer_bilimleri":14}
          counts = {}
          for item in data: counts[item["category"]] = counts.get(item["category"], 0) + 1
          if counts != expected: raise SystemExit(f"Unexpected lesson category totals: {counts}")
          new_lessons = [item for item in data if item.get("isNew") is True]
          if len(new_lessons) != 35 or any(len(item.get("sources", [])) < 2 or any(not source.get("url", "").startswith("https://") for source in item.get("sources", [])) for item in new_lessons):
              raise SystemExit("New lesson source validation failed.")
          src = (base / "java/com/elyionn/spektrum/PeriodicTableData.kt").read_text(encoding="utf-8")
          block = src.split("val elementRows = listOf(",1)[1].split(").map { it.split",1)[0]
          rows = re.findall(r'"([A-Z][a-z]?)\|[^|]+\|(\d+)\|', block)
          if len(rows) != 118 or sorted(int(n) for _,n in rows) != list(range(1,119)): raise SystemExit("Periodic table does not contain all 118 elements.")
          html = (base / "assets/lab/index.html").read_text(encoding="utf-8")
          buttons = re.findall(r"\['([a-z0-9-]+)',", html)
          if len(buttons) != 48 or len(set(buttons)) != 48: raise SystemExit(f"Expected 48 unique Canvas scenes, got {len(buttons)}")
          if "reportReady" not in html or "reportError" not in html or "pointerdown" not in html: raise SystemExit("3D bridge or touch interaction missing.")
          main = (base / "java/com/elyionn/spektrum/MainActivity.kt").read_text(encoding="utf-8")
          for marker in ("onRenderProcessGone", "labInstance++", "casual", "sans-serif-black", "Midnight Violet", "Obsidian Ember"):
              if marker not in main: raise SystemExit(f"Kotlin feature missing: {marker}")
          if 'versionName = "1.7.6"' not in Path("app/build.gradle.kts").read_text(encoding="utf-8"): raise SystemExit("App version metadata mismatch.")
          print(f"Validated {len(data)} lessons, 118 elements, {len(buttons)} 3D scenes and Android XML resources.")
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("app/src/main/assets/lab/index.html").read_text(encoding="utf-8")
          m=re.search(r"<script>([\s\S]*?)</script>",html)
          if not m: raise SystemExit("Canvas script not found")
          Path("/tmp/spectrum-176-lab.js").write_text(m.group(1),encoding="utf-8")
          PY
          node --check /tmp/spectrum-176-lab.js
          node scripts/test_lab_runtime.cjs

      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest

      - name: Verify unit test reports
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not files: raise SystemExit("No JUnit reports were produced.")
          total=failures=errors=0
          for p in files:
              r=ET.parse(p).getroot(); total+=int(r.attrib.get("tests",0)); failures+=int(r.attrib.get("failures",0)); errors+=int(r.attrib.get("errors",0))
          if total<1 or failures or errors: raise SystemExit(f"JUnit failure: tests={total}, failures={failures}, errors={errors}")
          print(f"JUnit passed: {total} tests")
          PY

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK" && test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          test "$(apkanalyzer manifest application-id "$DEBUG_APK")" = "com.elyionn.spectrum.debug"
          test "$(apkanalyzer manifest application-id "$RELEASE_APK")" = "com.elyionn.spectrum"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload APKs, unit tests and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.7.6-build-results
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
            ${{ steps.project.outputs.dir }}/app/build/test-results/**
            ${{ steps.project.outputs.dir }}/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
          
