name: Spectrum 1.6.6 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Spectrum_1.6.6_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, validate and build Spectrum 1.6.6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # Leave packages empty: this action expects a space-separated string,
          # not a YAML multiline list. Install SDK components in the next step.
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Extract and locate Spectrum project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Spectrum_1.6.6_Android_Project.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Missing $ARCHIVE in repository root."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          EXTRACT_DIR="$RUNNER_TEMP/spectrum-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$EXTRACT_DIR/Spectrum_1.6.6"
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" || ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "Spectrum 1.6.6 project files were not found in the expected ZIP folder."
            echo "Extracted files (first 100):"
            find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -100
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at $PROJECT_DIR"

      - name: Verify project and version metadata
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 19' app/build.gradle.kts
          grep -Fq 'versionName = "1.6.6"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          echo "Validated Spectrum 1.6.6 (versionCode 19)."

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate Android XML
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          xml_files = list(Path('app/src/main').rglob('*.xml'))
          for path in xml_files:
              ET.parse(path)
          print(f'Validated {len(xml_files)} Android XML files.')
          PY

      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.6.6-APKs
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 21
          
