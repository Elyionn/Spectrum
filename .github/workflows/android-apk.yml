
name: Build Spectrum 1.5.4 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Spectrum 1.5.4 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact Spectrum 1.5.4 project archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Spectrum_v1.5.4_FIXED_Android_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Missing Spectrum_v1.5.4_FIXED_Android_Project.zip in repository root"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi
          unzip -tq "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/spectrum-154"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/spectrum-154"
          PROJECT_DIR="$RUNNER_TEMP/spectrum-154/Spectrum"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          rsync -a --exclude='.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          test -f app/src/main/java/com/elyionn/spektrum/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import subprocess
          result = subprocess.run(['sdkmanager', '--licenses'], input='y\n' * 200, text=True)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PYCODE

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project version and required files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 10' app/build.gradle.kts
          grep -Fq 'versionName = "1.5.4"' app/build.gradle.kts
          grep -Fq 'com.android.application") version "8.7.3"' build.gradle.kts
          grep -Fq 'org.jetbrains.kotlin.android") version "2.0.21"' build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable-nodpi/spectrum_logo.png
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission in offline build"
            exit 1
          fi

      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import re, subprocess, tempfile
          from pathlib import Path
          source = Path('app/src/main/java/com/elyionn/spektrum/MainActivity.kt').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 4:
              raise SystemExit(f'Expected 4 embedded scripts, found {len(scripts)}')
          substitutions = {'$shellJson':'2,8,6', '$atomicNumber':'8', '$symbol':'O', '$isotopeLiteral':'16'}
          with tempfile.TemporaryDirectory() as d:
              for i, script in enumerate(scripts):
                  for old, new in substitutions.items():
                      script = script.replace(old, new)
                  script = re.sub(r'\$\{[^}]*\}', 'localizedText', script)
                  path = Path(d) / f'model-{i}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print('Embedded JavaScript syntax checks passed')
          PYCODE

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-v1.5.4-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
