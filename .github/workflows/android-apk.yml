name: Spectrum 1.6.0 · Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Spectrum 1.6.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Android project root (folder or ZIP)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          if [[ -f "$ROOT/settings.gradle.kts" && -f "$ROOT/app/build.gradle.kts" ]]; then
            echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
            echo "Android project found at repository root."
            exit 0
          fi
          ARCHIVE="$(find "$ROOT" -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: Neither an Android project root nor a ZIP archive was found."
            find "$ROOT" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          EXTRACT="$RUNNER_TEMP/spectrum-project"
          mkdir -p "$EXTRACT"
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          SETTINGS="$(find "$EXTRACT" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: ZIP has no settings.gradle.kts."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: Found settings.gradle.kts but app/build.gradle.kts is missing from $PROJECT_DIR."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project metadata and datasets
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 13' app/build.gradle.kts
          grep -Fq 'versionName = "1.6.0"' app/build.gradle.kts
          grep -Fq 'com.android.application") version "8.7.3"' build.gradle.kts
          grep -Fq 'org.jetbrains.kotlin.android") version "2.0.21"' build.gradle.kts
          test -s app/src/main/java/com/elyionn/spektrum/MainActivity.kt
          test -s app/src/main/java/com/elyionn/spektrum/ScienceAtlas.kt
          test -s app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re
          from pathlib import Path
          main = Path('app/src/main/java/com/elyionn/spektrum/MainActivity.kt').read_text(encoding='utf-8')
          atlas = Path('app/src/main/java/com/elyionn/spektrum/ScienceAtlas.kt').read_text(encoding='utf-8')
          block = main.split('val elementRows = listOf(', 1)[1].split(').map { it.split', 1)[0]
          rows = re.findall(r'"([A-Z][a-z]?)\|[^|]+\|(\d+)\|', block)
          numbers = [int(z) for _, z in rows]
          if len(rows) != 118 or sorted(numbers) != list(range(1,119)):
              raise SystemExit(f'Periodic table invalid: {len(rows)} rows, atomic numbers={len(set(numbers))}')
          ids = re.findall(r'AtlasTopic\("([a-z0-9_-]+)"', atlas)
          if len(ids) < 18 or len(ids) != len(set(ids)):
              raise SystemExit(f'Atlas topic IDs invalid: {len(ids)} entries')
          required = [
              'ScienceAtlasPage', 'AtlasTopicPage', 'ScienceLibraryPage',
              'completed_topics', 'DAILY SCIENCE', 'SpectrumHomePage',
              'SpectrumExplorePage', 'SpectrumLabHubPage',
              'categoryReturnPage', 'FilterChip'
          ]
          for marker in required:
              if marker not in atlas + main:
                  raise SystemExit(f'Missing integrated feature marker: {marker}')
          print(f'Validated {len(rows)} elements, {len(ids)} unique atlas topics and redesigned UI route markers.')
          PY

      - name: Generate Gradle wrapper if project does not include one
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate Android XML
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('app/src/main').rglob('*.xml'))
          for f in files:
              ET.parse(f)
          print(f'Validated {len(files)} XML resources.')
          PY

      - name: Check embedded WebView JavaScript syntax
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          source=Path('app/src/main/java/com/elyionn/spektrum/MainActivity.kt').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 3:
              raise SystemExit(f'Expected 3 embedded scripts, found {len(scripts)}')
          replacements={'$shellJson':'2,8,6','$atomicNumber':'8','$symbol':'O','$isotopeLiteral':'16'}
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  for old,new in replacements.items():
                      script=script.replace(old,new)
                  script=re.sub(r'\$\{[^}]*\}', 'localizedText', script)
                  path=Path(directory)/f'visual-{index}.js'
                  path.write_text(script,encoding='utf-8')
                  subprocess.run(['node','--check',str(path)],check=True)
          print('All embedded JavaScript blocks passed syntax validation.')
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/spectrum-debug-build.log"

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/spectrum-release-build.log"

      - name: Verify APK outputs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"

      - name: Upload APKs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.6.0-build-output
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/spectrum-debug-build.log
            ${{ runner.temp }}/spectrum-release-build.log
          if-no-files-found: warn
          retention-days: 21
          
