name: Spectrum 1.6.6 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'Spectrum_1.6.6/app/**'
      - 'gradle/**'
      - 'Spectrum_1.6.6/gradle/**'
      - '*.gradle*'
      - 'Spectrum_1.6.6/*.gradle*'
      - 'gradle.properties'
      - 'Spectrum_1.6.6/gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Spectrum 1.6.6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            PROJECT_DIR="."
          elif [[ -f Spectrum_1.6.6/settings.gradle.kts && -f Spectrum_1.6.6/app/build.gradle.kts ]]; then
            PROJECT_DIR="Spectrum_1.6.6"
          else
            echo "Android project not found. Expected settings.gradle.kts and app/build.gradle.kts in repository root or Spectrum_1.6.6/."
            echo "Repository files (first 80):"
            find . -maxdepth 3 -type f | sort | head -80
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify project and version metadata
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 19' app/build.gradle.kts
          grep -Fq 'versionName = "1.6.6"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          echo "Validated Spectrum 1.6.6 (versionCode 19)."

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate Android XML
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path('app/src/main').rglob('*.xml'))
          for file in files:
              ET.parse(file)
          print(f'Validated {len(files)} XML files.')
          PY

      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Spectrum-1.6.6-APKs
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 21
          
