name: Spectrum 1.7.5v2 Android Build - Validated SDK and 3D stability

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Spectrum_1.7.5v2_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build Spectrum 1.7.5v2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          python3 - "$SDKMANAGER" <<'PYLICENSE'
          import subprocess, sys
          result = subprocess.run(
              [sys.argv[1], "--licenses"],
              input="y\n" * 100,
              text=True,
              check=False,
          )
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PYLICENSE
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Validate and safely extract source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("Spectrum_1.7.5v2_Android_Project.zip")
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("ERROR: Spectrum_1.7.5v2_Android_Project.zip is missing or empty at repository root.")
          out = Path(os.environ["RUNNER_TEMP"]) / "spectrum-175v2"
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ERROR: ZIP CRC check failed at: {bad}")
              names = zf.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("ERROR: ZIP contains duplicate member paths.")
              for info in zf.infolist():
                  normalized = info.filename.replace("\\", "/")
                  path = PurePosixPath(normalized)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"ERROR: Unsafe ZIP member rejected: {info.filename}")
              settings_files = [n for n in names if PurePosixPath(n).name == "settings.gradle.kts"]
              roots = []
              for settings in settings_files:
                  parent = str(PurePosixPath(settings).parent)
                  prefix = "" if parent == "." else parent + "/"
                  if prefix + "app/build.gradle.kts" in names and prefix + "app/src/main/AndroidManifest.xml" in names:
                      roots.append(parent)
              if len(roots) != 1:
                  raise SystemExit(f"ERROR: Expected one Android Gradle project root, found {len(roots)}: {roots}")
              root = roots[0]
              build_path = (root + "/" if root != "." else "") + "app/build.gradle.kts"
              build_text = zf.read(build_path).decode("utf-8")
              if 'versionName = "1.7.5"' not in build_text or "versionCode = 28" not in build_text:
                  raise SystemExit("ERROR: ZIP source does not declare versionName 1.7.5 and versionCode 28.")
              zf.extractall(out)
          project = (out / root).resolve()
          if not project.is_relative_to(out.resolve()):
              raise SystemExit("ERROR: Extracted project root escaped the temporary directory.")
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml"):
              if not (project / required).is_file():
                  raise SystemExit(f"ERROR: Required project file missing after extraction: {required}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dir={project}\n")
          print(f"ZIP validated and extracted successfully: {project}")
          PY

      - name: Verify version and application identity
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 28' app/build.gradle.kts
          grep -Fq 'versionName = "1.7.5"' app/build.gradle.kts
          grep -Fq 'compileSdk = 35' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          grep -Fq 'namespace = "com.elyionn.spektrum"' app/build.gradle.kts
          test -s app/src/test/java/com/elyionn/spektrum/PeriodicTableDataTest.kt

      - name: Generate Gradle wrapper when absent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Validate project data and bundled JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path("app/src/main")
          for p in base.rglob("*.xml"):
              ET.parse(p)
          data = json.loads((base / "assets/data/science_topics.json").read_text(encoding="utf-8"))
          slugs = [x.get("slug") for x in data]
          required = ("slug", "title", "category", "summary", "lead", "how", "life", "facts")
          if len(data) != 151 or len(slugs) != len(set(slugs)) or any(not x.get(k) for x in data for k in required):
              raise SystemExit("Science Atlas validation failed: expected 151 complete lessons and unique slugs")
          expected = {"biyoloji": 26, "fizik": 26, "kimya": 23, "matematik": 21, "uzay": 21, "elektronik": 20, "yer_bilimleri": 14}
          counts = {}
          for item in data: counts[item["category"]] = counts.get(item["category"], 0) + 1
          if counts != expected:
              raise SystemExit(f"Unexpected science category totals: {counts}")
          added = [x for x in data if x.get("isNew") is True]
          if len(added) != 35 or any(len(x.get("sources", [])) < 2 or any(not s.get("url", "").startswith("https://") for s in x.get("sources", [])) for x in added):
              raise SystemExit("New lesson source validation failed")
          src = (base / "java/com/elyionn/spektrum/PeriodicTableData.kt").read_text(encoding="utf-8")
          block = src.split("val elementRows = listOf(", 1)[1].split(").map { it.split", 1)[0]
          rows = re.findall(r'"([A-Z][a-z]?)\|[^|]+\|(\d+)\|', block)
          if len(rows) != 118 or sorted(int(n) for _, n in rows) != list(range(1, 119)):
              raise SystemExit(f"Periodic table validation failed: {len(rows)} valid element rows")
          main = (base / "java/com/elyionn/spektrum/MainActivity.kt").read_text(encoding="utf-8")
          if "pauseTimers()" in main:
              raise SystemExit("Process-wide WebView pauseTimers() is not allowed")
          if "SettingsPage(" not in main or "onReset =" not in main or "Restore default settings" not in main:
              raise SystemExit("Settings redesign/reset flow missing")
          if 'versionName = "1.7.5"' not in Path("app/build.gradle.kts").read_text(encoding="utf-8"):
              raise SystemExit("App version metadata mismatch")
          html = (base / "assets/lab/index.html").read_text(encoding="utf-8")
          buttons = set(re.findall(r'<button data-id="([a-z0-9-]+)"', html))
          defs = html.split("const defs={", 1)[1].split("};\nconst uiText=", 1)[0]
          registry = set(re.findall(r"(?:^|,)\s*['\"]?([a-z][a-z0-9-]*)['\"]?\s*:", defs))
          if len(buttons) < 48 or buttons - registry:
              raise SystemExit(f"3D scene registry mismatch: buttons={len(buttons)}, missing={sorted(buttons-registry)}")
          print(f"Validated {len(data)} lessons, 118 elements, {len(buttons)} 3D scenes and {len(list(base.rglob('*.xml')))} XML files")
          PY
          node --check app/src/main/assets/lab/three.module.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/lab/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          if not match: raise SystemExit("Three.js module script not found")
          Path("/tmp/spectrum-lab-module.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/spectrum-lab-module.mjs

      - name: Compile Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest

      - name: Verify unit test reports
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not files: raise SystemExit("No JUnit XML reports found")
          total = failures = errors = 0
          for p in files:
              root = ET.parse(p).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
          if total < 1 or failures or errors:
              raise SystemExit(f"JUnit failed: tests={total}, failures={failures}, errors={errors}")
          print(f"JUnit passed: {total} tests")
          PY

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APKs and package identity
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK" && test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          test "$(apkanalyzer manifest application-id "$DEBUG_APK")" = "com.elyionn.spectrum.debug"
          test "$(apkanalyzer manifest application-id "$RELEASE_APK")" = "com.elyionn.spectrum"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload APKs, test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.7.5v2-build-results
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
            ${{ steps.project.outputs.dir }}/app/build/test-results/**
            ${{ steps.project.outputs.dir }}/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
          
