name: Build Spectrum 1.5.5 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Spectrum 1.5.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Spectrum_v1.5.5_Android_Project.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; ls -lah; exit 1; }
          unzip -tq "$ZIP_FILE"
          EXTRACT_DIR="$RUNNER_TEMP/spectrum-155"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$EXTRACT_DIR/Spectrum"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/elyionn/spektrum/MainActivity.kt"
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify versions, required resources and implemented modules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 12' app/build.gradle.kts
          grep -Fq 'versionName = "1.5.5"' app/build.gradle.kts
          grep -Fq 'com.android.application") version "8.7.3"' build.gradle.kts
          grep -Fq 'org.jetbrains.kotlin.android") version "2.0.21"' build.gradle.kts
          grep -Fq 'androidx.compose.animation:animation-core' app/build.gradle.kts
          test -s app/src/main/java/com/elyionn/spektrum/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable-nodpi/spectrum_logo.png
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/com/elyionn/spektrum/MainActivity.kt').read_text(encoding='utf-8')
          required = [
              'detectTransformGestures', 'LearningQuiz(', 'DnaHelixView(',
              'ANATOMY MODEL STATUS', 'Spectrum 1.5.5', 'sans-serif-condensed'
          ]
          for item in required:
              if item not in source:
                  raise SystemExit(f'Missing expected 1.5.5 source feature: {item}')
          if 'private fun Anatomy3DView' in source:
              raise SystemExit('The previous schematic anatomy renderer should remain removed')
          if 'private val englishNames' not in source:
              raise SystemExit('Periodic-table English localization data is missing')
          if 'android.permission.INTERNET' in Path('app/src/main/AndroidManifest.xml').read_text():
              raise SystemExit('Unexpected INTERNET permission in offline build')
          print('Version, source features, offline manifest and anatomy placeholder removal verified')
          PY

      - name: Validate Android XML resources
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path('app/src/main').rglob('*.xml'))
          for path in files:
              ET.parse(path)
              print(f'XML OK: {path}')
          print(f'Validated {len(files)} XML resources')
          PY

      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          source = Path('app/src/main/java/com/elyionn/spektrum/MainActivity.kt').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', source)
          if len(scripts) != 3:
              raise SystemExit(f'Expected 3 embedded scripts, found {len(scripts)}')
          substitutions = {
              '$shellJson': '2,8,6', '$atomicNumber': '8', '$symbol': 'O',
              '$isotopeLiteral': '16'
          }
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  for old, new in substitutions.items():
                      script = script.replace(old, new)
                  script = re.sub(r'\$\{[^}]*\}', 'localizedText', script)
                  path = Path(directory) / f'model-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print('All embedded JavaScript blocks passed node --check')
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-v1.5.5-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
