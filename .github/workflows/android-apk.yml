name: Build Spectrum 1.5.2 FIXED APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Spectrum 1.5.2 Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Spectrum project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Spectrum_v1.5.2_FIXED_Android_Project.zip"

          echo "Checking project ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Spectrum ZIP not found."
            echo "Files in repository:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/spectrum"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/spectrum"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/spectrum" -name settings.gradle.kts -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cp -R "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          echo "Project extracted successfully."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/elyionn/spektrum/MainActivity.kt

          grep -q 'versionName = "1.5.2"' app/build.gradle.kts
          grep -q 'versionCode = 8' app/build.gradle.kts

          echo "Spectrum 1.5.2 verification successful."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-v1.5.2-FIXED-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
