name: Spectrum 1.7.1 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Spectrum_1.7.1_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: spectrum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build Spectrum 1.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and safely extract source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("Spectrum_1.7.1_Android_Project.zip")
          if not archive.is_file():
              raise SystemExit(
                  "Source ZIP not found. Upload Spectrum_1.7.1_Android_Project.zip "
                  "to the repository root (same level as the .github folder)."
              )

          out = Path(os.environ["RUNNER_TEMP"]) / "spectrum-171-source"
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              names = zf.namelist()
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe ZIP entry: {info.filename}")
              settings_files = [n for n in names if PurePosixPath(n).name == "settings.gradle.kts"]
              roots = []
              for item in settings_files:
                  parent = str(PurePosixPath(item).parent)
                  prefix = "" if parent == "." else parent + "/"
                  build_file = prefix + "app/build.gradle.kts"
                  manifest = prefix + "app/src/main/AndroidManifest.xml"
                  if build_file in names and manifest in names:
                      build_text = zf.read(build_file).decode("utf-8", "replace")
                      if 'versionName = "1.7.1"' in build_text and 'versionCode = 24' in build_text:
                          roots.append(parent)
              if len(roots) != 1:
                  raise SystemExit(
                      f"Expected exactly one Spectrum 1.7.1 Android project in ZIP; found {len(roots)}. "
                      "The archive must contain settings.gradle.kts, app/build.gradle.kts and AndroidManifest.xml."
                  )
              zf.extractall(out)

          project = (out / roots[0]).resolve()
          if not project.is_relative_to(out.resolve()):
              raise SystemExit("Extracted project path escaped the temporary directory")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dir={project}\n")
          print(f"Successfully extracted project: {project}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project metadata
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 24' app/build.gradle.kts
          grep -Fq 'versionName = "1.7.1"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.elyionn.spectrum"' app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml

      - name: Generate Gradle wrapper if missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Compile Kotlin and run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Build debug and release APKs
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-1.7.1-build-results
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
            ${{ steps.project.outputs.dir }}/app/build/test-results/**
            ${{ steps.project.outputs.dir }}/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
          
