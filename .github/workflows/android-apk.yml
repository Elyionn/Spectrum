
name: Build Spectrum APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Spectrum project
        shell: bash
        run: |
          set -e
          unzip Spectrum_v1.0_Android_Project.zip -d unpacked

          PROJECT_DIR=$(find unpacked -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found in ZIP"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          ls -la
          ls -la app

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Spectrum APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-v1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
